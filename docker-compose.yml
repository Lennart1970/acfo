services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: acfo
      MYSQL_USER: acfo
      MYSQL_PASSWORD: acfo
      MYSQL_ROOT_PASSWORD: acfo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  mysql_data:
